html,body{margin:0;background:transparent}
.orb{width:var(--s);height:var(--s);border-radius:50%;position:relative;
 background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.88),rgba(255,255,255,0) 42%),radial-gradient(circle at 50% 82%,#8fe0ff,#2186c9 55%,#0a3d66);

#bg::before{top:38%;background:linear-gradient(90deg,transparent,rgba(190,240,255,.22),rgba(255,255,255,.08),transparent);transform:rotate(-11deg)}

.tag{font-family:O;font-weight:500;color:#cfe8f5;letter-spacing:.06em}

 -webkit-mask:radial-gradient(circle,transparent calc(50% - var(--w)),#000 calc(50% - var(--w) + 1px),#000 50%,transparent calc(50% + 1px));filter:drop-shadow(0 0 8px rgba(140,220,255,.9))}
