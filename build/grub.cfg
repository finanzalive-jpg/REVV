set default=0
set timeout=5
set timeout_style=menu
insmod all_video
insmod gfxterm
insmod png
set gfxmode=auto
loadfont unicode
terminal_output gfxterm
set theme=/boot/grub/themes/rise/theme.txt
set color_normal=white/black
set color_highlight=black/light-cyan

menuentry "Avvia Rise" {
    linux /casper/vmlinuz boot=casper username=rise hostname=rise locale=it_IT.UTF-8 keyboard-configuration/layoutcode=it quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0 ---
    initrd /casper/initrd
}

menuentry "Grafica di sicurezza (se lo schermo resta nero)" {
    linux /casper/vmlinuz boot=casper username=rise hostname=rise locale=it_IT.UTF-8 keyboard-configuration/layoutcode=it nomodeset quiet ---
    initrd /casper/initrd
}

menuentry "Avvia tutto in memoria (poi togli la chiavetta)" {
    linux /casper/vmlinuz boot=casper toram username=rise hostname=rise locale=it_IT.UTF-8 keyboard-configuration/layoutcode=it quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0 ---
    initrd /casper/initrd
}

menuentry "Spegni" {
    halt
}
