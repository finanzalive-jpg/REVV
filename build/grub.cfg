set default=0
set timeout=5
set timeout_style=menu
insmod all_video
insmod gfxterm
set gfxmode=auto
terminal_output gfxterm
set color_normal=white/black
set color_highlight=black/light-cyan

menuentry "Avvia Revv" {
    linux /casper/vmlinuz boot=casper username=revv hostname=revv locale=it_IT.UTF-8 keyboard-configuration/layoutcode=it quiet splash ---
    initrd /casper/initrd
}

menuentry "Avvia Revv - grafica di sicurezza (se lo schermo resta nero)" {
    linux /casper/vmlinuz boot=casper username=revv hostname=revv locale=it_IT.UTF-8 keyboard-configuration/layoutcode=it nomodeset quiet ---
    initrd /casper/initrd
}

menuentry "Avvia Revv caricandolo tutto in memoria (poi puoi togliere la chiavetta)" {
    linux /casper/vmlinuz boot=casper toram username=revv hostname=revv locale=it_IT.UTF-8 keyboard-configuration/layoutcode=it quiet splash ---
    initrd /casper/initrd
}

menuentry "Spegni il computer" {
    halt
}
