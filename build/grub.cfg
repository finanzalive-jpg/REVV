set default=0
set timeout=5
set timeout_style=menu
insmod all_video
insmod gfxterm
insmod png
set gfxmode=auto
loadfont unicode
terminal_output gfxterm
set gfxpayload=keep
set theme=/boot/grub/themes/rise/theme.txt
# sfondo anche per la finestra di testo di GRUB: mentre carica il sistema non compare nessun riquadro nero
background_image /boot/grub/themes/rise/bg.png
set color_normal=white/black
set color_highlight=black/light-cyan

menuentry "Avvia Rise" {
    # UEFI: si passa al testo e lo schermo si pulisce. BIOS: si resta in grafica (così poi compare il logo
    # di Rise) ma senza tema, così la finestra di testo occupa tutto lo schermo e non resta un riquadro scuro.
    if [ "$grub_platform" = "efi" ]; then terminal_output console; else set theme=; terminal_output console; terminal_output gfxterm; background_image /boot/grub/themes/rise/bg.png; fi
    clear
    linux /casper/vmlinuz boot=casper noprompt username=rise hostname=rise locale=it_IT.UTF-8 keyboard-configuration/layoutcode=it quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0 ---
    initrd /casper/initrd
}

menuentry "Grafica di sicurezza (se lo schermo resta nero)" {
    # UEFI: si passa al testo e lo schermo si pulisce. BIOS: si resta in grafica (così poi compare il logo
    # di Rise) ma senza tema, così la finestra di testo occupa tutto lo schermo e non resta un riquadro scuro.
    if [ "$grub_platform" = "efi" ]; then terminal_output console; else set theme=; terminal_output console; terminal_output gfxterm; background_image /boot/grub/themes/rise/bg.png; fi
    clear
    linux /casper/vmlinuz boot=casper noprompt username=rise hostname=rise locale=it_IT.UTF-8 keyboard-configuration/layoutcode=it nomodeset quiet ---
    initrd /casper/initrd
}

menuentry "Avvia tutto in memoria (poi togli la chiavetta)" {
    # UEFI: si passa al testo e lo schermo si pulisce. BIOS: si resta in grafica (così poi compare il logo
    # di Rise) ma senza tema, così la finestra di testo occupa tutto lo schermo e non resta un riquadro scuro.
    if [ "$grub_platform" = "efi" ]; then terminal_output console; else set theme=; terminal_output console; terminal_output gfxterm; background_image /boot/grub/themes/rise/bg.png; fi
    clear
    linux /casper/vmlinuz boot=casper noprompt toram username=rise hostname=rise locale=it_IT.UTF-8 keyboard-configuration/layoutcode=it quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0 ---
    initrd /casper/initrd
}

menuentry "Spegni" {
    halt
}
