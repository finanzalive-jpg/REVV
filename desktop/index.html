<title>Rise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: desktop a schermo intero — sfondo cielo, icone a sinistra, finestre di vetro con riflessi, superbar in basso.
   Un solo look deliberato (vetro Aero chiaro su cielo profondo): niente tema scuro separato. */
:root{
  --sky-deep:#0a2236;
  --sky-mid:#14506e;
  --sky-glow:#5fb4d6;
  --glass:rgba(214,234,246,.46);
  --glass-edge:rgba(255,255,255,.6);
  --paper:#f7fafc;
  --paper-2:#e9f0f4;
  --ink:#122430;
  --ink-soft:#4c6573;
  --line:#d3e1e8;
  --accent:#2186c9;
  --accent-ink:#ffffff;
  --ok:#1f8a5b;
  --warn:#b7791f;
  --bad:#c0392b;
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-brand:"Unbounded","Onest",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-doc:"Source Serif 4",Georgia,"Times New Roman",serif;
  --bar-h:52px;
  --ui:14.5px;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky-deep);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky-glow);outline-offset:2px}
.icon{display:block;flex:none;overflow:visible}

#screen{position:fixed;inset:0;font-size:var(--ui);transition:filter .2s}
#wall{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(ellipse 80% 55% at 78% 16%, rgba(150,220,245,.55), transparent 60%),
    radial-gradient(ellipse 60% 50% at 10% 90%, rgba(40,150,155,.55), transparent 65%),
    linear-gradient(160deg, var(--sky-mid) 0%, var(--sky-deep) 72%);}
#wall::before,#wall::after{content:"";position:absolute;left:-20%;right:-20%;height:22%;border-radius:50%;filter:blur(10px)}
#wall::before{top:38%;background:linear-gradient(90deg,transparent,rgba(190,240,255,.22),rgba(255,255,255,.08),transparent);transform:rotate(-11deg)}
#wall::after{top:55%;background:linear-gradient(90deg,transparent,rgba(120,220,210,.16),transparent 70%);transform:rotate(-6deg)}
#night{position:fixed;inset:0;pointer-events:none;background:#ff9a3c;mix-blend-mode:multiply;opacity:0;transition:opacity .4s;z-index:9000}
#night.on{opacity:.28}

/* Icone desktop */
#icons{position:absolute;top:14px;left:10px;bottom:64px;display:grid;gap:4px;z-index:1;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);align-content:start}
.dicon{width:92px;padding:8px 4px 6px;border:1px solid transparent;background:transparent;border-radius:4px;display:grid;justify-items:center;gap:5px;cursor:pointer;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 6px rgba(0,0,0,.4);font-size:.86em;line-height:1.25}
	.dicon .icon{filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.dicon:hover,.dicon:focus-visible{background:linear-gradient(rgba(185,225,250,.32),rgba(120,185,230,.22));border-color:rgba(200,235,255,.65);outline:none}

/* Finestre */
.win{position:absolute;display:flex;flex-direction:column;border-radius:9px;
  background:linear-gradient(115deg,transparent 16%,rgba(255,255,255,.24) 19%,transparent 25%,transparent 57%,rgba(255,255,255,.18) 60%,transparent 66%),var(--glass);
  backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);
  border:1px solid rgba(20,50,70,.55);box-shadow:0 0 0 1px var(--glass-edge) inset,0 20px 55px rgba(0,0,0,.42);
  padding:0 7px 7px;min-width:280px;min-height:200px;max-width:calc(100vw - 16px)}
.no-glass .win{background:#bfd5e2;backdrop-filter:none;-webkit-backdrop-filter:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--bar-h))!important;border-radius:0;max-width:none}
.win.inactive{background:linear-gradient(115deg,transparent 16%,rgba(255,255,255,.14) 19%,transparent 25%),rgba(200,214,224,.4)}
.win.inactive .tb-title{opacity:.55}
.tb{display:flex;align-items:center;gap:7px;height:32px;padding-left:4px;cursor:default;user-select:none;touch-action:none}
.tb-title{flex:1;font-weight:500;font-size:.95em;color:#0a1c27;text-shadow:0 0 8px #fff,0 0 12px #fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btns{align-self:flex-start;display:flex;border:1px solid rgba(15,40,60,.45);border-top:0;border-radius:0 0 6px 6px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.45)}
.wb{width:28px;height:20px;border:0;border-right:1px solid rgba(15,40,60,.3);border-radius:0;display:grid;place-items:center;cursor:pointer;color:#1b3444;
  background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.3) 49%,rgba(190,220,238,.25) 50%,rgba(255,255,255,.5))}
.wb:hover{background:linear-gradient(rgba(220,245,255,.95),rgba(150,210,245,.6) 49%,rgba(90,175,230,.55) 50%,rgba(160,220,250,.8))}
.wb.close{width:44px;border-right:0;color:#fff;background:linear-gradient(#e7a796,#cf6550 49%,#b53a22 50%,#d36a4f)}
.wb.close:hover{background:linear-gradient(#f8c2b2,#ea7a60 49%,#d4482b 50%,#ee8a6c)}
.wb svg{width:11px;height:11px;stroke:currentColor;stroke-width:2;fill:none;filter:drop-shadow(0 1px 0 rgba(255,255,255,.4))}
.wb.close svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.wbody{flex:1;min-height:0;background:var(--paper);border-radius:3px;border:1px solid rgba(20,50,70,.4);overflow:auto;color:var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.5)}

/* Superbar */
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar-h);padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;align-items:center;gap:4px;padding-inline:6px;
  background:linear-gradient(rgba(60,100,125,.5),rgba(12,32,46,.72));
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-top:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);z-index:5000;color:#fff;font-size:var(--ui)}
#orb{width:46px;height:46px;border-radius:50%;border:1px solid rgba(10,40,60,.8);cursor:pointer;flex:none;margin-right:4px;position:relative;
  background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0) 48%),radial-gradient(circle at 60% 85%,#1d4fd6 0%,#0b1d52 45%,#03060f 100%);
  box-shadow:0 0 0 2px rgba(255,255,255,.22),0 0 14px rgba(60,120,255,.55);display:grid;place-items:center;transition:box-shadow .2s}
#orb:hover,#orb[aria-expanded="true"]{box-shadow:0 0 0 2px rgba(255,255,255,.45),0 0 26px rgba(90,150,255,.95)}
#orb svg{width:34px;height:34px;filter:drop-shadow(0 0 4px rgba(80,150,255,.6))}
#tasks{flex:1;display:flex;gap:3px;min-width:0;overflow-x:auto;scrollbar-width:none}
.task{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 8px;border-radius:4px;border:1px solid transparent;background:transparent;cursor:pointer;color:#fff;max-width:200px;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92em}
.task:hover{background:radial-gradient(ellipse 70% 90% at 50% 100%,rgba(140,215,255,.55),transparent 72%),linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.04));border-color:rgba(255,255,255,.38)}
.task.open{background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.04) 50%,rgba(255,255,255,0) 51%,rgba(255,255,255,.06));border-color:rgba(255,255,255,.2)}
.task.active{background:radial-gradient(ellipse 70% 80% at 50% 100%,rgba(140,215,255,.35),transparent 72%),linear-gradient(rgba(255,255,255,.32),rgba(255,255,255,.1) 50%,rgba(255,255,255,.03) 51%,rgba(255,255,255,.14));border-color:rgba(255,255,255,.45);box-shadow:inset 0 0 8px rgba(255,255,255,.2)}
#tray{display:flex;align-items:center;gap:2px;flex:none}
.tray-btn{height:42px;padding:0 9px;border:1px solid transparent;border-radius:4px;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
.tray-btn:hover{background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.05));border-color:rgba(255,255,255,.3)}
.tray-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
#clock{display:grid;text-align:center;line-height:1.2;font-size:.82em;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#peek{width:12px;height:100%;border:0;border-left:1px solid rgba(255,255,255,.25);background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.18));cursor:pointer;margin-right:-6px;flex:none}
#peek:hover{background:rgba(255,255,255,.35)}

/* Menu Start */
.pop{position:fixed;bottom:calc(var(--bar-h) + 6px);z-index:6000;font-size:var(--ui)}
#start{left:6px;width:min(610px,calc(100vw - 12px));max-height:calc(100% - var(--bar-h) - 20px);display:flex;padding:8px;box-sizing:border-box;border-radius:10px;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.14) 33%,transparent 40%),rgba(18,56,80,.66);
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid rgba(5,25,40,.7);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 20px 60px rgba(0,0,0,.5);color:#fff}
.st-left{flex:1;min-width:0;background:rgba(250,253,255,.96);color:var(--ink);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(5,25,40,.45)}
.st-search{padding:12px 12px 8px}
.st-search input{width:100%;box-sizing:border-box;height:38px;border-radius:7px;border:1px solid #b9cdd8;background:#fff;padding:0 12px;font:inherit;color:var(--ink);box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.st-label{font-size:.72em;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;padding:4px 16px}
.st-list{overflow:auto;padding:0 6px 8px;display:grid;gap:1px}
.st-item{display:flex;align-items:center;gap:12px;padding:6px 10px;border:1px solid transparent;border-radius:4px;background:transparent;text-align:left;cursor:pointer;width:100%}
.st-item:hover,.st-item.sel{background:linear-gradient(#eef7fd,#d6ecfa);border-color:#a8d2ee}
.st-item b{display:block;font-weight:600}
.st-item small{display:block;color:var(--ink-soft);font-size:.86em}
.st-kind{margin-left:auto;font-size:.72em;color:var(--ink-soft);border:1px solid var(--line);border-radius:20px;padding:2px 8px;flex:none;background:#fff}
.st-empty{padding:12px 16px;color:var(--ink-soft)}
.st-right{width:176px;flex:none;display:flex;flex-direction:column;gap:2px;padding:2px 0 0 8px}
.st-user{display:grid;justify-items:center;gap:6px;padding:4px 0 10px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.avatar{width:58px;height:58px;border-radius:8px;border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.4);
  background:radial-gradient(circle at 50% 25%,rgba(255,255,255,.6),transparent 45%),linear-gradient(160deg,#7cc4e4,#22628a);display:grid;place-items:center;font-size:1.2em;color:#fff}
.place{display:flex;align-items:center;gap:9px;text-align:left;padding:7px 10px;border:1px solid transparent;border-radius:4px;background:transparent;color:#fff;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.place:hover{background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.08) 50%,rgba(255,255,255,.02) 51%,rgba(255,255,255,.12));border-color:rgba(255,255,255,.45)}
.place hr{display:none}
.st-sep{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);margin:5px 0}
.power{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;height:34px;border-radius:4px;border:1px solid rgba(5,25,40,.6);cursor:pointer;font-weight:500;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6);
  background:linear-gradient(#e7a796,#cf6550 49%,#b53a22 50%,#d36a4f)}
.power:hover{filter:brightness(1.12)}
.pw-row{margin-top:auto;display:flex;gap:6px}
.pw-row .power{margin-top:0;flex:1}
.power.alt{flex:0 0 40px;background:linear-gradient(#cfe3ef,#8fb3c8 49%,#6b93ab 50%,#9cc0d4)}
@media (max-width:720px){.pw-row{flex:1 0 100%}}

#quick{right:6px;width:min(340px,calc(100vw - 12px));padding:16px;display:grid;gap:14px;border-radius:10px;color:var(--ink);
  background:rgba(240,248,252,.86);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(5,25,40,.5);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.q-net{display:flex;gap:12px;align-items:center}
.q-row label{display:flex;justify-content:space-between;font-weight:600;font-size:.9em;margin-bottom:6px}

/* Controlli comuni */
.btn{height:34px;padding:0 15px;border-radius:4px;border:1px solid #8fa9b8;cursor:pointer;font-weight:500;color:var(--ink);
  background:linear-gradient(#fdfeff,#eaf1f5 49%,#dbe6ec 50%,#eef3f6);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:#3c8fc4;background:linear-gradient(#f2faff,#dcf0fb 49%,#bfe2f6 50%,#d9effb)}
.btn.primary{color:#fff;border-color:color-mix(in srgb,var(--accent) 70%,#000);text-shadow:0 1px 1px rgba(0,0,0,.3);
  background:linear-gradient(color-mix(in srgb,var(--accent) 55%,#fff),var(--accent) 49%,color-mix(in srgb,var(--accent) 85%,#000) 50%,var(--accent))}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:default}
.switch{position:relative;width:46px;height:26px;border-radius:20px;border:1px solid #9fb3bf;background:linear-gradient(#c9d6dd,#e3eaee);cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:linear-gradient(#fff,#e3eaee);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .2s}
.switch[aria-checked="true"]{background:linear-gradient(color-mix(in srgb,var(--accent) 80%,#000),var(--accent));border-color:color-mix(in srgb,var(--accent) 70%,#000)}
.switch[aria-checked="true"]::after{left:22px}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid #8fa9b8;border-radius:4px;overflow:hidden;background:linear-gradient(#fdfeff,#e6eef3)}
.seg button{border:0;background:transparent;padding:7px 13px;cursor:pointer}
.seg button+button{border-left:1px solid #b8c9d3}
.seg button[aria-pressed="true"]{background:linear-gradient(color-mix(in srgb,var(--accent) 55%,#fff),var(--accent));color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
select{height:34px;border-radius:4px;border:1px solid #8fa9b8;padding:0 10px;font:inherit;background:#fff;color:var(--ink)}

/* Impostazioni */
.set{display:flex;height:100%;min-height:0}
.set-nav{width:196px;flex:none;padding:10px 6px;border-right:1px solid var(--line);background:linear-gradient(90deg,#e4eef4,#eef4f8);display:grid;align-content:start;gap:2px;overflow:auto}
.set-nav button{display:flex;align-items:center;gap:10px;padding:6px 9px;border:1px solid transparent;border-radius:4px;background:transparent;cursor:pointer;text-align:left}
.set-nav button:hover{background:rgba(255,255,255,.7);border-color:#cfe3ef}
.set-nav button[aria-current="true"]{background:linear-gradient(#f4fbff,#d9eefb);border-color:#9fcdea;font-weight:600}
.set-main{flex:1;min-width:0;overflow:auto;padding:20px 24px 28px}
.set-main h2{margin:0 0 4px;font-size:1.45em;font-weight:600;color:#123a56;text-wrap:balance}
.set-main .lead{margin:0 0 18px;color:var(--ink-soft);max-width:60ch}
.rows{display:grid;gap:8px}
.row{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:13px 16px;border:1px solid var(--line);border-radius:6px;background:#fff;flex-wrap:wrap;transition:box-shadow .3s}
.row.flash{box-shadow:0 0 0 3px var(--accent)}
.row .txt{flex:1 1 260px;min-width:0}
.row .txt b{display:block;font-weight:600}
.row .txt small{display:block;color:var(--ink-soft);margin-top:2px;line-height:1.4;max-width:58ch}
.row .ctl{flex:0 1 230px;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.tag.warn{background:rgba(183,121,31,.14);color:var(--warn)}
.tag.neutral{background:var(--paper-2);color:var(--ink)}
.nets-head{padding:14px 2px 0;display:flex;justify-content:space-between;align-items:center}
.nets-head .btn{height:28px;padding:0 12px}
.net-err{grid-column:1/-1;color:var(--bad)}
.diag .st.fail{background:var(--bad);border-color:var(--bad)}
.diag .result.bad{background:rgba(192,57,43,.1);color:var(--bad)}
.tag{font-size:.72em;font-weight:600;padding:2px 8px;border-radius:20px;background:rgba(31,138,91,.12);color:var(--ok);white-space:nowrap}
.preview{font-size:var(--ui);padding:10px 14px;border-radius:5px;background:var(--paper-2);color:var(--ink);margin-top:8px}
.note{font-size:.85em;color:var(--ink-soft);margin:10px 0 0}
.status{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:7px;margin-bottom:12px;border:1px solid}
.status.ok{background:linear-gradient(#f1fbf5,#e1f4ea);border-color:rgba(31,138,91,.35)}
.status.off{background:linear-gradient(#fff9ee,#fbeed6);border-color:rgba(183,121,31,.4)}
.status .dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:inset 0 2px 4px rgba(255,255,255,.4)}
.status.ok .dot{background:radial-gradient(circle at 50% 30%,#6fd6a2,var(--ok))} .status.off .dot{background:radial-gradient(circle at 50% 30%,#f2c66d,var(--warn))}
.status .dot svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.status b{font-size:1.06em}
.nets{display:grid;gap:5px;margin:8px 0 16px}
.net{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 14px;border:1px solid var(--line);border-radius:6px;background:#fff}
.net small{color:var(--ink-soft);display:block}
.net small.risk{color:var(--warn)}
.bars{display:flex;gap:2px;align-items:flex-end;height:16px}
.bars i{width:4px;border-radius:1px;background:#c5d3da}
.bars i.on{background:linear-gradient(#5ccf8f,var(--ok))}
.pw{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.pw input{flex:1;min-width:140px;height:34px;border-radius:4px;border:1px solid #8fa9b8;padding:0 10px;font:inherit}
.pw .eye{height:34px;padding:0 10px;font-size:.9em}
.pw .kbd-hint{flex-basis:100%;color:var(--ink-soft);font-size:.86em}
.diag{display:grid;gap:5px;margin-top:10px}
.diag div{display:flex;gap:10px;align-items:center;padding:7px 12px;border-radius:5px;background:var(--paper-2);font-size:.95em}
.diag .st{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #aabbc4}
.diag .st.run{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.diag .st.done{background:var(--ok);border-color:var(--ok)}
.diag .result{background:rgba(31,138,91,.12);color:var(--ok);font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 22px;padding:16px;border:1px solid var(--line);border-radius:6px;background:#fff;margin:0}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.meter{height:14px;border-radius:2px;border:1px solid #9fb3bf;background:linear-gradient(#e6edf1,#fafcfd);overflow:hidden;margin-top:6px;max-width:260px}
.meter i{display:block;height:100%;background:linear-gradient(#8fe0b4,#2fae6b 50%,#1f8a5b 51%,#3dbb77)}
.hw{display:grid;gap:5px;margin-top:6px}
.hw div{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
.hw span{flex:1;min-width:0}
.hw .tag{flex:none}
.hw small{display:block;color:var(--ink-soft)}
.swatches{display:flex;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #9fb3bf,inset 0 6px 8px rgba(255,255,255,.45);cursor:pointer}

/* Esplora file */

.fx table{width:100%;border-collapse:collapse;font-size:.93em}

.btn.danger{border-color:#b53a22;color:#fff;background:linear-gradient(#e7a796,#cf6550 49%,#b53a22 50%,#d36a4f)}
.fx-modal{position:absolute;inset:0;background:rgba(10,30,45,.35);display:grid;place-items:center;z-index:30}

.fx .list{position:relative}
.fx-empty p{margin:0;max-width:46ch;line-height:1.5}

.doc-page td,.doc-page th{border:1px solid #b8c3d1;padding:5px 9px;vertical-align:top}

.sheet-tabs{display:flex;gap:2px;padding:6px 8px 0;background:var(--paper-2);position:sticky;top:0;z-index:1;flex-wrap:wrap}

.grid{overflow:auto;background:#fff}
.grid table{border-collapse:collapse;font-size:.88em;font-variant-numeric:tabular-nums}
.grid td,.grid th{border:1px solid #dbe4ea;padding:4px 9px;white-space:nowrap;text-align:left}

.vw-info{padding:22px;display:grid;gap:14px;max-width:680px;margin:0 auto}

.hex{font-family:var(--f-mono);font-size:.78em;background:#0f2733;color:#bfe3f0;padding:12px 14px;border-radius:6px;overflow-x:auto;white-space:pre;margin:0}

/* Note */
.ai{height:100%;display:flex;flex-direction:column;background:linear-gradient(#f7faff,#eef4fb)}
.ai-body{flex:1;min-height:0;display:flex;flex-direction:column}

.ai-hero{display:flex;gap:16px;align-items:center;margin-bottom:12px}.ai-hero h2{margin:0 0 4px}

.ai-log{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:82%;padding:10px 13px;border-radius:12px;line-height:1.5;word-wrap:break-word}

.ai-msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.ai-msg.tool{align-self:center;background:#eaf3ea;border:1px solid #b9dcb9;font-size:.92em;display:flex;align-items:center;gap:8px}

.ai-face .fbox,.ai-face-st{pointer-events:auto}
.ai-face .fbox{width:112px;height:244px;transition:filter .3s}
.ai-face canvas{width:112px;height:244px;display:block;animation:fbreath 5s ease-in-out infinite;transform-origin:50% 90%}
.ai-face.listen .fbox{filter:drop-shadow(0 0 7px rgba(216,58,58,.55))}
.ai-face.talk .fbox{filter:drop-shadow(0 0 7px rgba(47,108,240,.5))}

.ai-msg.user.heard{display:none}

.ai-msg .ai-h{font-size:1.08em}.ai-msg code{background:#eef2f6;padding:0 4px;border-radius:3px}
.ai-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ai-act .btn{font-size:.88em}
.ai-dots{display:inline-flex;gap:4px;vertical-align:middle}.ai-dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.3;animation:aidot 1.2s infinite ease-in-out}.ai-dots i:nth-child(2){animation-delay:.2s}.ai-dots i:nth-child(3){animation-delay:.4s}
@keyframes aidot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.ai-phase{color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}.ai-live{margin-top:6px;padding:8px 10px;background:#f6f9fc;border:1px dashed var(--line);border-radius:6px;font-size:.92em;max-height:260px;overflow:auto}

.store{display:flex;flex-direction:column;height:100%}.sto-top{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}.sto-top>div{flex:1;min-width:220px;display:grid}.sto-top small{color:var(--ink-soft)}
.sto-q{flex:1 1 260px;padding:8px 12px;border:1px solid var(--line);border-radius:18px;font:inherit}
.sto-body{flex:1;overflow:auto;padding:6px 16px 16px}.sto-body h3{margin:16px 0 8px;font-size:1em;color:var(--ink-soft)}
.sto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sto-card{display:grid;grid-template-columns:48px 1fr;grid-template-rows:auto auto;gap:4px 10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.sto-card img{width:48px;height:48px;grid-row:1/3}.sto-t{display:grid}.sto-t small{color:var(--ink-soft);font-size:.86em}.sto-a{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sto-a .meter{flex:1;min-width:80px}
.walls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.wsw{width:46px;height:30px;border-radius:5px;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}.wsw[aria-pressed=true]{border-color:var(--accent)}

.st-item{position:relative}.st-flash{position:absolute;right:8px;top:8px;background:var(--accent);color:#fff;font-size:.8em;padding:2px 8px;border-radius:10px}
.mail-draft{display:grid;gap:6px;min-width:min(460px,70vw)}.mail-draft label{display:grid;gap:2px;font-size:.88em;color:var(--ink-soft)}.mail-draft input:not([type=checkbox]),.mail-draft textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:5px;color:var(--ink)}
.md-save{display:flex!important;align-items:center;gap:6px}.md-att{font-size:.9em}.md-act{display:flex;gap:6px;flex-wrap:wrap}.md-act .ok{color:#1d7a3a;font-weight:600}.md-act .err{color:#b3261e}

.rub{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.rub span{flex:1;color:var(--ink-soft)}.rub-add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.rub-add input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:5px}
.ai-mkt{border-collapse:collapse;margin:6px 0;font-size:.93em}.ai-mkt td{padding:3px 12px 3px 0;border-bottom:1px solid var(--line)}.ai-mkt td:nth-child(2){text-align:right;font-variant-numeric:tabular-nums}.ai-mkt .up{color:#16833c;font-weight:600}.ai-mkt .dn{color:#c0392b;font-weight:600}
.ai-mail{max-height:240px;overflow:auto;margin:6px 0;padding:8px 10px;background:#f6f9fc;border-radius:6px;font-size:.92em}
.inst-ask{display:grid;grid-template-columns:48px 1fr;gap:6px 12px;align-items:center;min-width:min(380px,70vw)}.inst-ask .md-act{grid-column:1/3}.inst-ask .meter{flex:1;min-width:120px}
.ai-mic{display:inline-grid;place-items:center;min-width:42px}.ai-mic.rec{background:#d83a3a;color:#fff;border-color:#b52626;transition:box-shadow .15s}

.ai-thinkbox{margin:-2px 0 8px;font-size:.86em;color:var(--ink-soft)}.ai-thinkbox summary{cursor:pointer}.ai-thinkbox div{white-space:pre-wrap;max-height:220px;overflow:auto;margin-top:6px;padding:8px;background:#f6f9fc;border-radius:6px}
.ai-thinklive{white-space:pre-wrap;color:var(--ink-soft);font-size:.86em;max-height:140px}
.ai-hint{margin:auto;max-width:460px;display:grid;gap:8px;text-align:center}
.ai-chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:8px 12px;cursor:pointer;font:inherit;text-align:left}
.ai-chip:hover{border-color:var(--accent)}
.ai-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
.ai{position:relative}.ai-toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#1d3346;color:#fff;padding:8px 14px;border-radius:6px;font-size:.92em;max-width:80%}.ai-toast.bad{background:#a3261e}
.ai-in textarea{flex:1;resize:none;border:1px solid #9fb3c2;border-radius:6px;padding:8px 10px;font:inherit}
.notes{display:flex;flex-direction:column;height:100%}
.notes textarea{flex:1;border:0;resize:none;padding:16px 20px;font:inherit;font-size:1.02em;line-height:1.6;background:linear-gradient(#fffef6,#fffef6) ;color:var(--ink);outline:none}
.notes footer{padding:5px 12px;font-size:.8em;color:var(--ink-soft);border-top:1px solid var(--line);display:flex;justify-content:space-between;background:linear-gradient(#fff,#eef3f6)}

/* Calcolatrice */
.calc{padding:12px;display:grid;gap:10px;background:linear-gradient(#f4f8fa,#dfe8ed);min-height:100%;box-sizing:border-box}
.calc .disp{background:linear-gradient(#e9f6ee,#cfe8d8);color:#11301f;border:1px solid #8fae9b;box-shadow:inset 0 2px 5px rgba(0,0,0,.18);border-radius:4px;padding:10px 12px;text-align:right;font-family:var(--f-mono);min-height:56px;display:grid;align-content:end;overflow:hidden}
.calc .disp small{color:#4f7360;font-size:.8em;min-height:1.2em;word-break:break-all}
.calc .disp span{font-size:1.7em;word-break:break-all}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .keys button{height:42px;border-radius:4px;border:1px solid #8fa9b8;cursor:pointer;font-size:1.05em;font-variant-numeric:tabular-nums;background:linear-gradient(#fdfeff,#eaf1f5 49%,#dbe6ec 50%,#eef3f6)}
.calc .keys button:hover{border-color:#3c8fc4;background:linear-gradient(#f2faff,#dcf0fb 49%,#bfe2f6 50%,#d9effb)}
.calc .keys button.op{background:linear-gradient(#f2f5f7,#dde5ea 49%,#cdd8df 50%,#e0e8ec)}
.calc .keys button.eq{color:#fff;border-color:#a3601a;text-shadow:0 1px 1px rgba(0,0,0,.3);background:linear-gradient(#ffd08f,#f0a03e 49%,#dc8420 50%,#f2a548)}

/* Rilascio file e spegnimento */
#drop{position:fixed;inset:0;z-index:8500;display:grid;place-items:center;background:rgba(33,134,201,.22);border:3px dashed rgba(255,255,255,.85);pointer-events:none;color:#fff;font-size:1.4em;font-weight:600;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#off{position:fixed;inset:0;z-index:9500;background:radial-gradient(ellipse at 50% 45%,#0e2433,#03070a 70%);color:#cfe3ec;display:grid;place-items:center;text-align:center}
#off .logo{font-family:var(--f-brand);font-size:2em;letter-spacing:.02em;display:flex;align-items:center;gap:12px;justify-content:center}
#off p{color:#7c98a5;margin:10px 0 22px;max-width:44ch}
#boot{font-family:var(--f-mono);font-size:.82em;color:#7c98a5;min-height:1.4em;margin-bottom:12px}

@media (max-width:720px){
  .win{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--bar-h))!important;border-radius:0;max-width:none;padding:0 4px 4px}
  .wb.max{display:none}
  .set-nav{width:58px} .set-nav button span{display:none}
  .fx nav{width:58px} .fx nav button span,.fx-g{display:none}
  .task span{display:none} .task{padding:0 8px}
  #clock small{display:none}
  #icons{grid-template-columns:repeat(2,92px)}
  #start{flex-direction:column;gap:8px}
  .st-right{width:auto;flex-direction:row;flex-wrap:wrap;padding:0}
  .st-user,.st-sep{display:none}
  .power{margin-top:0;flex:1 0 100%}
  .doc-page{padding:28px 22px;margin:10px}
}

.rz{position:fixed;z-index:50}
.rz[data-e=n]{top:0;left:8px;right:8px;height:5px;cursor:n-resize}.rz[data-e=s]{bottom:0;left:8px;right:8px;height:5px;cursor:s-resize}
.rz[data-e=e]{right:0;top:8px;bottom:8px;width:5px;cursor:e-resize}.rz[data-e=w]{left:0;top:8px;bottom:8px;width:5px;cursor:w-resize}

  background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.08)),rgba(10,40,60,.62);border:1px solid rgba(255,255,255,.4);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35);
  text-shadow:0 1px 2px rgba(0,0,0,.5);z-index:40;animation:bb-in .5s ease-out;transition:opacity .9s}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const EXT=n=>{const p=n.split('.');return p.length>1?p.pop().toLowerCase():''};
const KIND={image:'jpg jpeg png gif webp bmp svg avif ico',video:'mp4 webm mov m4v ogv',audio:'mp3 wav ogg oga m4a flac aac opus',pdf:'pdf',word:'docx',
  sheet:'xlsx xls xlsm ods',csv:'csv tsv',text:'txt md log json xml html htm css js ts jsx tsx py ini cfg conf yml yaml sh bat ps1 mq4 mq5 mqh pine sql c cpp h cs java php rb go rs srt vtt',
  slides:'pptx ppt odp key',oldword:'doc odt rtf pages',archive:'zip rar 7z tar gz',app:'exe msi deb rpm apk dmg appimage'};
const KLAB={image:'Immagine',video:'Video',audio:'Musica',pdf:'Documento PDF',word:'Documento Word',sheet:'Foglio di calcolo',csv:'Tabella CSV',text:'Testo',slides:'Presentazione',oldword:'Documento',archive:'Archivio compresso',app:'Programma',other:'File'};
function kindOf(n){const e=EXT(n);for(const k in KIND)if(KIND[k].split(' ').includes(e))return k;return 'other'}
const BAND={pdf:'#d23b2f',word:'#2b6cc4',oldword:'#2b6cc4',sheet:'#1f8a4c',csv:'#1f8a4c',slides:'#d9682a',archive:'#8a6d3b',app:'#55658a',text:'#6b7c88',other:'#7a8790'};
const EXICO={pdf:'m-pdf',doc:'m-word',docx:'m-word',rtf:'m-word',pages:'m-word',odt:'m-odt',xls:'m-xls',xlsx:'m-xls',xlsm:'m-xls',ods:'m-ods',csv:'m-csv',tsv:'m-csv',ppt:'m-ppt',pptx:'m-ppt',key:'m-ppt',odp:'m-odp',
  txt:'m-txt',md:'m-txt',srt:'m-txt',vtt:'m-txt',log:'m-log',json:'m-json',xml:'m-xml',html:'m-html',htm:'m-html',py:'m-py',c:'m-c',cpp:'m-c',h:'m-c',cs:'m-c',java:'m-c',
  zip:'m-zip',rar:'m-zip','7z':'m-zip',tar:'m-tar',gz:'m-tar',exe:'m-exe',msi:'m-exe',bat:'m-exe',deb:'m-deb',rpm:'m-bin',apk:'m-bin',dmg:'m-bin',appimage:'m-bin'};
function fileIcon(name,s=20){const k=kindOf(name),e=EXT(name);
  if(k==='image')return I('m-image',s);if(k==='audio')return I('m-audio',s);if(k==='video')return I('m-video',s);
  if(EXICO[e])return I(EXICO[e],s);if(k==='text')return I('m-script',s);if(k==='other')return I('m-unknown',s);
  const lab=(EXT(name)||'?').slice(0,4).toUpperCase();
  return `<svg class="icon" width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-page"/><rect x="5" y="28" width="${Math.max(22,lab.length*7+6)}" height="11" rx="1.6" fill="${BAND[k]}" stroke="rgba(0,0,0,.25)" stroke-width=".5"/><text x="${5+Math.max(22,lab.length*7+6)/2}" y="36.3" font-size="7.6" font-weight="700" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif">${lab}</text></svg>`}

window.__riseToast=m=>{let t=document.getElementById('rise-toast');if(!t){t=document.createElement('div');t.id='rise-toast';t.style.cssText='position:fixed;left:50%;bottom:70px;transform:translateX(-50%);max-width:80vw;background:#3a1f1f;color:#fff;padding:10px 16px;border-radius:8px;z-index:99999;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.35)';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,9000)};
const NATIVE=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.rise);
const SYS=(()=>{let n=0;const wait={};

      else if(en.isDirectory){const rd=en.createReader();let batch;do{batch=await new Promise((r,j)=>rd.readEntries(r,j));for(const c of batch)await walk(c,path+en.name+'/')}while(batch.length)}};
    try{for(const en of ens)await walk(en,'')}catch(err){}}
  if(!items.length)items=[...e.dataTransfer.files].map(f=>({f,path:f.name}));
  if(!items.length)return;
  const d=addFiles(items);

        if(k==='csv'){const rows=parseCSV(txt).slice(0,2000);body.innerHTML=`<div class="grid"><table>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`}
        else body.innerHTML=`<div class="vw-text"><pre>${esc(txt)}${big?'\n\n… (mostrati i primi 3 MB)':''}</pre></div>`;return}
      if(k==='pdf'){await lib('pdf');await lib('pdfw');if(my!==tok)return;
        const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;if(my!==tok)return;
        $('.vw-meta',b).textContent+=' · '+pdf.numPages+(pdf.numPages===1?' pagina':' pagine');
        body.innerHTML='<div class="pdf"></div>';const wrap=$('.pdf',body);const max=Math.min(pdf.numPages,60);
        for(let i=1;i<=max;i++){const page=await pdf.getPage(i);if(my!==tok)return;const v0=page.getViewport({scale:1});
          const cssW=Math.min(Math.max(body.clientWidth-40,280),900),dpr=Math.min(devicePixelRatio||1,2);const vp=page.getViewport({scale:cssW/v0.width*dpr});
          const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.width=cssW+'px';wrap.appendChild(c);
          await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}
        if(pdf.numPages>max)wrap.insertAdjacentHTML('beforeend',`<p style="color:#fff">Mostrate le prime ${max} pagine su ${pdf.numPages}.</p>`);return}
      if(k==='word'){await lib('mammoth');if(my!==tok)return;const r=await window.mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()});if(my!==tok)return;
        body.innerHTML=`<div class="doc-page">${r.value||'<p><i>Documento vuoto.</i></p>'}</div>`;return}
      if(k==='sheet'){await lib('xlsx');if(my!==tok)return;const wb=window.XLSX.read(await f.arrayBuffer(),{type:'array'});if(my!==tok)return;
        body.innerHTML=`<div class="sheet-tabs">${wb.SheetNames.map((n,i)=>`<button data-s="${i}" aria-pressed="${i===0}">${esc(n)}</button>`).join('')}</div><div class="grid"></div>`;
        const show=i=>{$$('.sheet-tabs button',body).forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.s===i)));
          const h=window.XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[i]]);const tm=h.match(/<table[\s\S]*<\/table>/i);$('.grid',body).innerHTML=tm?tm[0]:'<p style="padding:16px">Foglio vuoto.</p>'};
        $$('.sheet-tabs button',body).forEach(x=>x.onclick=()=>show(+x.dataset.s));show(0);return}
      const why={slides:'È una presentazione. Nella versione installata la apre la suite Office integrata.',oldword:'È un documento in un formato più vecchio. Nella versione installata lo apre la suite Office integrata.',
        archive:'È un archivio compresso. Nella versione installata potrai estrarlo con un clic.',app:'È un programma di installazione. Nella versione installata Rise ti chiede conferma e lo installa.',
        other:'Rise non conosce questo formato, ma ti mostra lo stesso cosa c\'è dentro.'}[k];
      info(f,why);
    }catch(err){if(my!==tok)return;
      info(f,err&&err.message==='lib'?'Per aprire PDF, Word ed Excel il prototipo scarica un lettore da internet, e adesso non ci riesce. Controlla la connessione e riprova.':'Non riesco a leggere questo file. Potrebbe essere danneggiato o protetto da password.')}
    async function info(f,why){const bytes=new Uint8Array(await f.slice(0,256).arrayBuffer());if(my!==tok)return;let hx='';
      for(let o=0;o<bytes.length;o+=16){const row=[...bytes.slice(o,o+16)];hx+=o.toString(16).padStart(6,'0')+'  '+row.map(x=>x.toString(16).padStart(2,'0')).join(' ').padEnd(48)+'  '+row.map(x=>x>31&&x<127?String.fromCharCode(x):'·').join('')+'\n'}
      body.innerHTML=`<div class="vw-info"><div class="head">${fileIcon(f.name,56)}<div><b>${esc(f.name)}</b><br><small>${KLAB[k]} · ${fsize(f.size)} · modificato il ${fdate(f.lastModified)}</small></div></div><p>${why}</p>${bytes.length?`<p>Primi ${bytes.length} byte del file:</p><pre class="hex">${esc(hx)}</pre>`:''}</div>`}
  }
  if(opts&&opts.goto)load(opts.goto);else emptyState();
  return load;
}

function renderStore(b){
  b.innerHTML=`<div class="store"><div class="sto-top">${I('store',30)}<div><b>Negozio</b><small>Programmi gratuiti da Flathub, il catalogo libero per Linux: si installano con un clic e si tolgono senza lasciare tracce.</small></div>
    <input type="search" class="sto-q" placeholder="Cerca un programma (es. Chrome, Spotify, Zoom)" aria-label="Cerca"></div><div class="sto-body"><p class="note">Carico il catalogo…</p></div></div>`;
  const body=$('.sto-body',b),qi=$('.sto-q',b);let DATA=null,poll=null,LAST=null;
  if(!NATIVE){body.innerHTML='<p class="note">Il Negozio funziona sul PC con Rise.</p>';return}
  const card=a=>{const j=(DATA&&DATA.jobs||{})[a.id];
    const act=j&&j.running?`<div class="meter"><i style="width:${j.pct||3}%"></i></div><small>${esc(j.msg||'')} ${j.pct?j.pct+'%':''}</small>`

  const bind=()=>{
    $$('[data-inst]',body).forEach(x=>x.onclick=async()=>{x.disabled=true;const r=await SYS.call('store.install',{id:x.dataset.inst,name:x.dataset.name});if(!r.ok){alert(r.message);return}watch()});
    $$('[data-run]',body).forEach(x=>x.onclick=()=>SYS.call('store.launch',{id:x.dataset.run}));
    $$('[data-rm]',body).forEach(x=>x.onclick=async()=>{if(!confirm('Togliere questo programma?'))return;x.disabled=true;await SYS.call('store.remove',{id:x.dataset.rm});await load();refreshNative()})};
  const refreshNative=()=>SYS.call('native.list').then(l=>{NAPPS=l||[]}).catch(()=>{});

  async function load(){try{DATA=await SYS.call('store.catalog')}catch(e){body.innerHTML='<p class="note err">Non riesco ad aprire il Negozio.</p>';return}
    DATA.installedSet=new Set(DATA.categories.flatMap(c=>c.apps.filter(a=>a.installed).map(a=>a.id)));show()}
  function watch(){if(poll)return;poll=setInterval(async()=>{if(!b.isConnected){clearInterval(poll);return}let r;try{r=await SYS.call('store.jobs')}catch(e){return}
      DATA.jobs=r.jobs;DATA.installedSet=new Set(r.installed);DATA.categories.forEach(c=>c.apps.forEach(a=>a.installed=DATA.installedSet.has(a.id)));
      show();if(!Object.values(r.jobs).some(j=>j.running)){clearInterval(poll);poll=null;refreshNative()}},1000)}
  let qt=null;qi.oninput=()=>{clearTimeout(qt);qt=setTimeout(async()=>{const v=qi.value.trim();if(!v){LAST=null;show();return}
    body.innerHTML='<p class="note">Cerco…</p>';const r=await SYS.call('store.search',{q:v}).catch(()=>({results:[]}));LAST=r.results||[];show()},450)};

        const r=document.createElement('div');r.className='result';r.textContent='Tutto a posto: internet funziona.';d.appendChild(r);
        btn.disabled=false;btn.textContent='Controlla di nuovo';
        if(fixed)setTimeout(()=>{if(d.isConnected)show('rete','fix')},1200);return}
      const el=document.createElement('div');el.innerHTML=`<span class="st run"></span><span style="flex:1">${esc(steps[i][0])}</span><span style="color:var(--ink-soft)">controllo…</span>`;d.appendChild(el);
      i++;setTimeout(next,650);
    })();
  }
  $$('.set-nav button',b).forEach(x=>x.onclick=()=>show(x.dataset.s));
  setRefresh=(sec,soft)=>{if(!b.isConnected){setRefresh=null;return}if(sec&&sec!==cur)return;
    if(soft&&!sec&&['sistema','condivisione'].includes(cur))return;  // pagine che non dipendono dalle impostazioni: restano ferme

    if(soft&&(cur==='sistema'||cur==='condivisione'))return; // pagine con dati letti una volta: niente ridisegni automatici
    if(soft&&(($('#diag',main)&&$('#diag',main).children.length)||$('.pw',main)||DRAGGING||(main.contains(document.activeElement)&&['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))))return;show(cur,null,soft)};
  const goto=(id)=>{const s=SETS.find(x=>x.id===id);if(s)show(s.sec,id)};
  if(opts&&opts.goto)goto(opts.goto);else show('schermo');
  return goto;
}

const AI_SYS_TXT=`Sei l'Assistente di Rise, il sistema operativo di questo computer. Rispondi in italiano, in modo chiaro e preciso. Ragiona con calma prima di rispondere.
Per il meteo usa SEMPRE lo strumento meteo (dati veri e immediati). Hai accesso a internet: per notizie, prezzi, orari, persone, prodotti o qualsiasi cosa che può essere cambiata di recente usa cerca_web e poi leggi_pagina sulle fonti migliori; alla fine indica i siti usati. Se le pagine non contengono l'informazione, dillo: non inventare mai dati.
Per un preventivo usa SEMPRE crea_preventivo: passa azienda, cliente, oggetto e le voci con quantità e prezzo unitario; i totali e l'IVA li calcola Rise. Non inventare nomi, indirizzi o prezzi: se mancano il cliente o i prezzi chiedili prima, in una sola domanda.
Per lettere e altri documenti usa crea_documento_word con un testo completo e curato, senza segnaposto tra parentesi quadre (titoli con #, elenchi con -, tabelle con |).
Per la posta in arrivo usa leggi_email; per riassumere, tradurre o capire un documento usa leggi_documento e poi rispondi tu (se chiede di salvare la traduzione o il riassunto usa crea_documento_word); per le notizie usa notizie; per borsa, indici, azioni, cambi e criptovalute usa mercati (riporta i dati, non dare consigli di investimento); per mandare un file al telefono usa manda_al_telefono; per Wi-Fi e Bluetooth usa wifi_bluetooth. Per installare programmi usa installa_app. Per promemoria, sveglie e timer usa crea_promemoria. Per cartelle e file usa crea_cartella, apri_file, crea_pdf. Per inviare email usa prepara_email (allega_ultimo=true per il documento appena fatto): l’utente conferma sempre prima dell’invio. Per aprire programmi usa apri_programma; per aprire un sito (YouTube, Gmail…) o cercare un video usa apri_sito. Per trovare file del computer usa cerca_file.`;

// Sulla posa a riposo si sfumano solo bocca e occhi delle altre pose, seguendo il volume della voce.
const RiseFace=(function(){
  const W=193,H=420;
  const CFG={
    sara:  {mouth:{cx:106,cy:326,rx:50,ry:38},eyes:[{cx:60,cy:229,rx:30,ry:18},{cx:145,cy:222,rx:30,ry:18}]},
    nicola:{mouth:{cx:108,cy:288,rx:54,ry:46},eyes:[{cx:70,cy:179,rx:30,ry:17},{cx:151,cy:183,rx:30,ry:17}]}
  };
  const POSE={rest:0,e:1,a:2,o:3,blink:4};
  // ritaglio di una posa dentro un'ellisse dai bordi morbidi
  function patch(img,pose,r){const pad=4,x0=Math.max(0,Math.round(r.cx-r.rx-pad)),y0=Math.max(0,Math.round(r.cy-r.ry-pad)),
      w=Math.min(W-x0,Math.round(r.rx*2+pad*2)),h=Math.min(H-y0,Math.round(r.ry*2+pad*2));
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
    g.drawImage(img,pose*W+x0,y0,w,h,0,0,w,h);
    g.globalCompositeOperation='destination-in';g.save();g.translate(r.cx-x0,r.cy-y0);g.scale(1,r.ry/r.rx);
    const gr=g.createRadialGradient(0,0,0,0,0,r.rx);gr.addColorStop(0,'#000');gr.addColorStop(.62,'#000');gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.fillRect(-r.rx,-r.rx,r.rx*2,r.rx*2);g.restore();return {c,x:x0,y:y0}}

          out.innerHTML=mdLite(clean)||'…';if(clean.length>350||/\n\s*([-*•]|\d+[.)])\s|^#/m.test(clean)||!VOICE)out.classList.add('keep');thinkBox(out,think,t0);{const rest=clean.slice(spokenUpTo).trim();if(VOICE&&rest)SYS.call('voice.say',{voice:VOICE,text:rest,append:spokenUpTo>0}).catch(()=>{});spokenUpTo=0}if(clean.length>120){const act=document.createElement('div');act.className='ai-act';act.innerHTML=`<button class="btn" data-doc>${I('m-word',16)} Crea documento Word con questo testo</button><button class="btn" data-copy>Copia</button>`;out.appendChild(act);
            $('[data-doc]',act).onclick=async()=>{const h=clean.match(/^#{1,3}\s+(.+)$/m);await runTool('crea_documento_word',{titolo:h?h[1].replace(/\*/g,'').slice(0,60):'Documento',testo:clean})};
            $('[data-copy]',act).onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(clean);toast('Testo copiato.')}}
          break}
        if(text.trim()){out.innerHTML=mdLite(text.replace(/<think>[\s\S]*?<\/think>/g,'').trim());thinkBox(out,think,t0)}else out.remove();
        msgs.push({role:'assistant',content:text||'',tool_calls:list.map(c=>({id:c.id,type:'function',function:{name:c.name,arguments:c.args||'{}'}}))});
        let needMore=false;
        for(const c of list){let a={};try{a=JSON.parse(c.args||'{}')}catch(e){}const r=await runTool(c.name,a);msgs.push({role:'tool',tool_call_id:c.id,content:r});if(/^(cerca_file|cerca_web|leggi_pagina|meteo)$/.test(c.name))needMore=true}
        if(!needMore){if(list.some(c=>c.name==='prepara_email')){msgs.push({role:'assistant',content:'Email pronta, aspetto conferma.'});break}
          const done=list.some(c=>c.name==='apri_sito')?'Fatto, l’ho aperto nel browser.':list.some(c=>/^crea_/.test(c.name))?'Fatto! Il documento è aperto: puoi correggerlo e salvarlo. Vuoi che cambi qualcosa?':'Fatto!';
          msgs.push({role:'assistant',content:done});add('bot',esc(done));speak(done);break}}
      }catch(e){if(e.name==='AbortError'){if(out&&$('.ai-dots',out))out.innerHTML='<small class="ai-phase">Interrotto.</small>'}else add('bot','<span class="err">Non riesco a parlare con l’Assistente. Riprova tra poco.</span>')}
      clearInterval(tick);
      busy=false;ctrl=null;send.textContent='Invia';if(FST==='think')faceState('idle');ta.focus()}
    ta.focus()}
  boot();
}

function renderNotes(b){
  b.innerHTML=`<div class="notes"><textarea id="note-text" aria-label="Testo della nota"></textarea><footer><span class="note-st">Salvata</span><span class="note-n"></span></footer></div>`;
  const t=$('textarea',b);t.value=store.get('note','Idee per Rise\n\n- Store app con un clic\n- Avvio diretto nel desktop\n- MetaTrader con Wine?');
  const cnt=()=>$('.note-n',b).textContent=t.value.trim().split(/\s+/).filter(Boolean).length+' parole';cnt();
  let tm;t.oninput=()=>{$('.note-st',b).textContent='Sto salvando…';cnt();clearTimeout(tm);tm=setTimeout(()=>{store.set('note',t.value);$('.note-st',b).textContent='Salvata'},500)};
}

/* ================= Calcolatrice ================= */
function renderCalc(b){
  const K=['C','%','⌫','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','00',',','='];
  b.innerHTML=`<div class="calc"><div class="disp"><small></small><span>0</span></div><div class="keys">${K.map(k=>`<button class="${'÷×−+%'.includes(k)?'op':k==='='?'eq':''}">${k}</button>`).join('')}</div></div>`;
  let ex='';const sm=$('.disp small',b),out=$('.disp span',b);
  const fmt=n=>Number.isFinite(n)?(+n.toFixed(10)).toLocaleString('it-IT',{maximumFractionDigits:8}):'Errore';
  const ev=s=>{const js=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'.').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
    if(!/^[\d+\-*/.() ]*$/.test(js))return NaN;try{return Function('"use strict";return ('+js+')')()}catch(e){return NaN}};
  $$('.keys button',b).forEach(x=>x.onclick=()=>{const k=x.textContent;
    if(k==='C')ex='';else if(k==='⌫')ex=ex.slice(0,-1);
    else if(k==='='){const r=ev(ex);sm.textContent=ex+' =';ex=Number.isFinite(r)?String(+r.toFixed(10)).replace('.',','):'';out.textContent=fmt(r);return}
    else ex+=k;
    sm.textContent='';out.textContent=ex||'0'});
}
